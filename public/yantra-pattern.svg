<svg xmlns="http://www.w3.org/2000/svg" width="340" height="340" viewBox="0 0 340 340">
  <!-- Patrón de Yantra / Mandala Védico para fondo editorial -->
  <!-- Estilo filigrana fina: trazos sutiles en azul tinta mineral -->
  <g fill="none" stroke="#1f4b75" stroke-opacity="0.055" stroke-width="0.8">
    <!-- Bhupura: cuadrado exterior con puertas cardinales escalonadas -->
    <!-- Marco exterior -->
    <rect x="25" y="25" width="290" height="290" stroke-width="0.9"/>
    <rect x="36" y="36" width="268" height="268" stroke-dasharray="3,3" stroke-width="0.6"/>

    <!-- Puertas cardinales (Norte, Sur, Este, Oeste) -->
    <!-- Puerta Norte (arriba) -->
    <path d="M 140 25 L 140 12 L 200 12 L 200 25" stroke-width="0.8"/>
    <path d="M 152 12 L 152 4 L 188 4 L 188 12" stroke-width="0.8"/>
    <!-- Puerta Sur (abajo) -->
    <path d="M 140 315 L 140 328 L 200 328 L 200 315" stroke-width="0.8"/>
    <path d="M 152 328 L 152 336 L 188 336 L 188 328" stroke-width="0.8"/>
    <!-- Puerta Oeste (izquierda) -->
    <path d="M 25 140 L 12 140 L 12 200 L 25 200" stroke-width="0.8"/>
    <path d="M 12 152 L 4 152 L 4 188 L 12 188" stroke-width="0.8"/>
    <!-- Puerta Este (derecha) -->
    <path d="M 315 140 L 328 140 L 328 200 L 315 200" stroke-width="0.8"/>
    <path d="M 328 152 L 336 152 L 336 188 L 328 188" stroke-width="0.8"/>

    <!-- Círculos concéntricos (Chakras) -->
    <circle cx="170" cy="170" r="122" stroke-width="0.9"/>
    <circle cx="170" cy="170" r="114" stroke-dasharray="2,3" stroke-width="0.5"/>
    <circle cx="170" cy="170" r="98" stroke-width="0.8"/>
    <circle cx="170" cy="170" r="76" stroke-width="0.7"/>
    <circle cx="170" cy="170" r="50" stroke-width="0.6"/>
    <circle cx="170" cy="170" r="26" stroke-dasharray="2,2" stroke-width="0.5"/>

    <!-- Loto exterior de 16 pétalos (pétalos curvos entre r=98 y r=122) -->
    <path d="
      M 170 48 Q 178 60 170 72 Q 162 60 170 48 Z
      M 217 58 Q 220 73 207 81 Q 203 66 217 58 Z
      M 256 84 Q 252 99 237 103 Q 241 88 256 84 Z
      M 282 123 Q 270 135 255 131 Q 267 119 282 123 Z
      M 292 170 Q 280 178 268 170 Q 280 162 292 170 Z
      M 282 217 Q 267 221 255 209 Q 270 205 282 217 Z
      M 256 256 Q 241 252 237 237 Q 252 241 256 256 Z
      M 217 282 Q 203 274 207 259 Q 220 267 217 282 Z
      M 170 292 Q 162 280 170 268 Q 178 280 170 292 Z
      M 123 282 Q 120 267 133 259 Q 137 274 123 282 Z
      M 84 256 Q 88 241 103 237 Q 99 252 84 256 Z
      M 58 217 Q 70 205 85 209 Q 73 221 58 217 Z
      M 48 170 Q 60 162 72 170 Q 60 178 48 170 Z
      M 58 123 Q 73 119 85 131 Q 70 135 58 123 Z
      M 84 84 Q 99 88 103 103 Q 88 99 84 84 Z
      M 123 58 Q 137 66 133 81 Q 120 73 123 58 Z
    " stroke-width="0.6"/>

    <!-- Loto interior de 8 pétalos (entre r=50 y r=76) -->
    <path d="
      M 170 94 Q 177 107 170 120 Q 163 107 170 94 Z
      M 224 116 Q 221 130 208 134 Q 211 120 224 116 Z
      M 246 170 Q 233 177 220 170 Q 233 163 246 170 Z
      M 224 224 Q 211 220 208 206 Q 221 210 224 224 Z
      M 170 246 Q 163 233 170 220 Q 177 233 170 246 Z
      M 116 224 Q 119 210 132 206 Q 129 220 116 224 Z
      M 94 170 Q 107 163 120 170 Q 107 177 94 170 Z
      M 116 116 Q 129 120 132 134 Q 119 130 116 116 Z
    " stroke-width="0.6"/>

    <!-- Yantra central: Triángulos entrelazados (Shatkona / Sri Yantra core) -->
    <!-- Triángulo Shiva (vértice arriba) -->
    <polygon points="170,120 127,195 213,195" stroke-width="0.8"/>
    <!-- Triángulo Shakti (vértice abajo) -->
    <polygon points="170,220 127,145 213,145" stroke-width="0.8"/>

    <!-- Segundo juego de triángulos menores entrelazados -->
    <polygon points="170,138 139,191 201,191" stroke-width="0.6"/>
    <polygon points="170,202 139,149 201,149" stroke-width="0.6"/>

    <!-- Bindu central (punto cósmico) -->
    <circle cx="170" cy="170" r="2.5" fill="#1f4b75" fill-opacity="0.25"/>
  </g>
</svg>
